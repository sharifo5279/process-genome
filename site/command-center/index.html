<style>

<script>
(function () {
  var PROCESSES = { retail: [{"n": "Order to cash", "owner": "Customer operations and accounts receivable", "outcome": "Fill retailer orders on time, with accepted ship notices and invoices, and collect payment without deductions.", "measures": ["Fill rate", "On-time and in-full (OTIF)", "ASN timeliness and accuracy", "First-time invoice match rate", "Days sales outstanding (DSO)"], "steps": [["Purchase order", "850 / ORDERS", 1, "The retailer's replenishment system sends the order: items, quantities, cost, ship window, ship-to location and order type.", "Items and costs must already exist in both systems. Order type (stock, cross-dock, store-direct) carries different packing and label rules, and the ship window sets the clock for everything after.", "Monitors inbound orders into order management, resolves item cross-reference failures, holds orders with unknown items or cost mismatches for review, and confirms the functional acknowledgment went back.", "An order that never loads is never shipped, and the retailer records a missed order against fill rate.", ["Monitoring", "Cross-references and master data", "Missing documents"]], ["Acknowledge order", "855 / ORDRSP", 0, "The supplier confirms each line, or reports changes, substitutions and back orders, within the retailer's window.", "Acknowledgment is due within a fixed window after the order, commonly a day or two. Unconfirmed or rejected lines count against the supplier, and some retailers cancel unacknowledged orders.", "Generates the acknowledgment from order entry, maps line status codes to the retailer's list, and chases missing acknowledgments on either side before the window closes.", "The retailer plans and promotes against quantities that will not arrive, or cancels the order.", ["Map build and maintenance", "Rejections", "Partner follow-up"]], ["Ship and label", "856 / DESADV", 0, "The supplier picks, packs and labels each carton and pallet with a GS1-128 label carrying an SSCC, then sends the ship notice with the shipment, order, pack and item hierarchy.", "The notice must be processed before the truck arrives, often at ship time. Every labeled SSCC must appear in it, pack hierarchy must follow the retailer's guide, and carrier and bill of lading numbers must match.", "Builds the notice from warehouse shipping data, validates hierarchy and SSCC counts before sending, watches the retailer's acknowledgment and application advice, and corrects and resends rejected notices before arrival.", "The dock receives by hand, the shipment is scored as no or late ASN, and chargebacks follow.", ["Rejections", "Fix routing", "Monitoring"]], ["Application advice", "824 / APERAK", 1, "The retailer's application reports ship notices or invoices it could not process, with the reason: unknown order, quantity mismatch, duplicate, missing reference.", "A functional acknowledgment only confirms the file was readable. Where sent, the application advice accepts or rejects the content; many retailers send one only on error, so silence is not acceptance. A resend must replace the original.", "Routes each reason code to the owner (warehouse, order entry, master data), tracks time to correct, and keeps the original and corrected documents as evidence for later disputes.", "Rejections go unseen, freight lands in the retailer's problem area, and the invoice is never paid.", ["Rejections", "Fix routing", "Support desk and on-call"]], ["Invoice", "810 / INVOIC", 0, "The supplier invoices per order and shipment with the order number, item identifiers, shipped quantities, cost and agreed allowances.", "Invoice only after shipment and after the ship notice. One invoice per order and shipment, cost equal to the order cost, allowances exactly as agreed, and no resends of an invoice already received.", "Generates the invoice after the ship notice is accepted, validates order number, cost and terms against the order, and monitors acknowledgments so a rejected invoice is corrected rather than resent.", "Rejected or short-paid invoices delay cash and turn into pricing and billing deductions.", ["Rejections", "Cross-references and master data", "Chargebacks and deductions management"]], ["Payment and remittance", "820 / REMADV", 1, "The retailer pays one net amount across many invoices and lists each invoice, deduction and allowance with a reason code.", "Remittance detail may travel with the payment or separately. Dispute windows start when the deduction appears, not when the supplier finds it.", "Loads the remittance into cash application, maps the retailer's reason codes, and routes each deduction to the deductions team with the matching order, notice and invoice records.", "Cash sits unapplied, and deductions age past the window in which they could be disputed.", ["Chargebacks and deductions management", "Missing documents", "Reporting and documentation"]]]}, {"n": "Receive, match and pay", "owner": "Distribution center operations, transportation and accounts payable", "outcome": "Receive goods against the ship notice, pay matched invoices on terms, and deduct only for real shortages and violations.", "measures": ["Supplier OTIF and fill rate", "Ship notice coverage and accuracy", "Dock-to-stock time", "First-time invoice match rate", "Days payable outstanding (DPO)"], "steps": [["Validate ship notice", "856, 824 / DESADV, APERAK", 0, "The retailer's system checks each inbound ship notice against the open order: order number, items, quantities, pack hierarchy and SSCCs, then loads it as an expected receipt.", "The notice must arrive before the truck, list every labeled SSCC once and reference an open order. Retailers reject a notice with errors whole or accept it with warnings; a rejected notice must be resent before arrival.", "Monitors notice coverage by supplier ahead of appointments, returns the functional acknowledgment and an application advice with a reason for each rejection, chases suppliers with no notice on file, and feeds repeat failures to vendor compliance.", "The dock receives by hand, item by item, and the shipment is scored as received without a notice.", ["Monitoring", "Rejections", "Partner follow-up"]], ["Appointment and arrival", "Portal", 0, "The carrier books a delivery appointment in the retailer's transportation system. The gate stamps arrival and matches bill of lading and PRO numbers to the appointment and the notice.", "Arrival is measured against a must-arrive-by window at order level; early and late both count as misses. Loads without an appointment are dated by the carrier's PRO date, which can be days after the truck arrived.", "Little document traffic here. The B2B team keeps bill of lading and PRO references on the notice consistent with the appointment, and supplies notice and gate timestamps when transportation and vendor compliance score on-time performance.", "The trailer waits in the yard, the order is scored late, and the supplier's on-time score drops with a chargeback behind it.", ["Reporting and documentation", "Monitoring"]], ["Scan and receive", "861, WMS / RECADV", 0, "Receivers scan the SSCC on each pallet or carton. A scan that matches the notice receives the unit as complete; overs, shorts, damage and unknown labels are counted by hand.", "Received quantity is compared with the order and the notice; shorts and overs count against fill rate, measured on the original order quantity. Cartons whose label will not scan or is missing from the notice go to the problem area. Where the retailer sends a receiving advice, it reports accepted and rejected quantities with reasons.", "Supplies the warehouse system with the notice detail that drives the scan, investigates receipts that could not be matched to a notice line, and keeps notice, scan and receipt history as the record later shortage and label chargebacks rest on.", "Receiving labor rises, stock sits in the problem area instead of reaching stores, and phantom shortages turn into deductions.", ["Cross-references and master data", "Reporting and documentation", "Support desk and on-call"]], ["Invoice in", "810 / INVOIC", 1, "The supplier invoices per order and shipment. The retailer's system checks vendor number, invoice number, order reference and totals, and returns an application advice for any invoice it cannot load.", "An invoice must reference an open order, carry a unique invoice number and arrive after shipment. A resend of an invoice already received is not a correction; it is rejected or deducted as duplicate billing.", "Maps each supplier's invoice into accounts payable, returns application advice for held or rejected invoices with the reason (invalid vendor number, blank invoice number, totals mismatch), and tracks suppliers whose invoices fail repeatedly for onboarding fixes.", "The invoice never reaches matching, payment terms never start, and the supplier chases a payment the retailer has no record of owing.", ["Rejections", "Cross-references and master data", "Monitoring"]], ["Match and approve", "ERP", 0, "Accounts payable matches each invoice line to the order and the receipt: item, quantity received, order cost and agreed allowances. Lines that match within tolerance are approved for payment.", "Three-way match. Invoice quantity above received quantity becomes a shortage deduction, invoice cost above order cost a pricing deduction, and an invoice with no receipt behind it is held or deducted in full.", "Supplies the order, notice and receipt data the match runs on, resolves item and unit-of-measure cross-reference breaks (case versus each) that create false mismatches, and reports first-time match rate by supplier.", "Manual matching backs up, suppliers are paid late or short without explanation, and deductions are raised on data errors rather than real shortages.", ["Cross-references and master data", "Reporting and documentation"]], ["Pay and remit", "820 / REMADV", 0, "The retailer pays one net amount per supplier across approved invoices, deductions and allowances, and sends a remittance listing each invoice and adjustment with a reason code.", "Reason codes should come from the standard adjustment code list so the supplier can apply cash automatically. Remittance detail travels inside the payment (CTX) or separately; a payment with no detail is unapplied cash on the supplier's side.", "Generates the remittance from the payment run, maps internal deduction codes to standard adjustment reason codes, and confirms every payment has a remittance the supplier can match to it.", "Suppliers cannot apply cash, dispute volume rises, and the retailer's payables team fields calls about payments it has already made.", ["Chargebacks and deductions management", "Map build and maintenance", "Partner follow-up"]]]}, {"n": "Routing and delivery", "owner": "Supplier shipping and retailer transportation", "outcome": "Move each order from the supplier's dock to the retailer's DC on the assigned carrier, inside the arrival window.", "measures": ["Collect freight ready at appointment", "Routing guide compliance", "Carrier on-time pickup and delivery", "Arrivals inside the must-arrive-by window"], "steps": [["Request routing", "753", 0, "When the order is picked and staged, the supplier sends a routing request per order and ship-from: ready date, cartons, pallets, weight, cube and destination DC.", "The request is due inside a window before the ship date, sometimes a day. Collect on-time is measured on readiness: against the declared ready date in some programs, the carrier's pickup appointment in others.", "Generates the request from the warehouse's ready status, validates that quantities and order references agree with the order, and confirms the retailer acknowledged it before the window closes.", "No routing comes back, the goods sit on the dock, and the order misses its arrival window as a supplier miss.", ["Missing documents", "Monitoring", "Partner follow-up"]], ["Routing instructions", "754", 1, "The retailer's transportation system consolidates requests into loads and returns the carrier, pickup date, load number and order references the supplier must ship under.", "Ship with the named carrier on the named date. A different carrier, a changed quantity or an early or late pickup is a routing guide violation. Pickup dates can be assigned shortly before the pickup window ends.", "Maps the instructions into the warehouse shipping system, carries load, carrier and appointment references forward so the ship notice and bill of lading match them, and alerts shipping when instructions change after the load was planned.", "Goods ship on the wrong carrier or date, the retailer re-bills the freight, and the supplier pays the transportation cost plus a fee.", ["Map build and maintenance", "Monitoring", "Partner follow-up"]], ["Tender load", "204, 990 / IFTMIN", 1, "The retailer tenders the load to the carrier: stops, pickup and delivery appointments, equipment and the orders on it. The carrier accepts or declines, and a declined load is re-tendered.", "The accepted tender is what freight audit pays against: rate, equipment and appointments. The load reference on it must match the routing instructions and the delivery appointment.", "Runs the carrier connections (tender out, response in), chases carriers that have not responded before the pickup, and keeps load, order and appointment references aligned across the tender, the routing instructions and the ship notice.", "No carrier shows at the supplier's dock, the pickup is missed, and the supplier has to prove the lateness was not its own.", ["Connections and protocols", "Partner follow-up", "Monitoring"]], ["Load and notify", "856 / DESADV", 0, "At the pickup appointment the supplier loads the carrier's trailer, signs the bill of lading with the carrier's PRO, and sends the ship notice as the truck leaves.", "Carrier, bill of lading and PRO numbers on the notice must match the routing instructions and the delivery appointment, and quantities must match the routing request. Collect freight not ready at the appointment is a supplier miss.", "Checks that the notice carries the load, carrier, bill of lading and PRO from the routing instructions before it is sent, and holds a notice whose references do not match rather than letting it reject at the retailer.", "The notice is rejected or scored inaccurate and the DC cannot tie the load it receives to the notice it holds.", ["Rejections", "Monitoring", "Cross-references and master data"]], ["Track and deliver", "214 / IFTSTA", 2, "The carrier reports pickup, transit and delivery status with timestamps and proof of delivery. The retailer's gate time becomes the arrival record for every order on the load.", "On-time is judged per order against the must-arrive-by window while the carrier drives to a load-level due date; early and late both miss. Prepaid freight is scored on arrival, collect freight on readiness at pickup.", "Correlates carrier status with the ship notice and the orders on the load, keeps status, timestamps and proof of delivery retrievable per shipment, and supplies them when an on-time score is challenged.", "The supplier takes the on-time penalty on prepaid freight, the retailer absorbs the delay on collect, and mismatched records leave both arguing over timestamps.", ["Monitoring", "Reporting and documentation"]], ["Freight invoice", "210 / INVOIC", 2, "The carrier invoices the party that controls the freight: the retailer on collect, the supplier on prepaid. Freight audit matches the invoice to the tender, the shipment and accessorial charges.", "Freight is paid against the tendered rate and the accepted load; accessorial charges need a reason the shipment record supports. Freight caused by a supplier routing violation is billed back to the supplier with a fee.", "Loads carrier invoices into freight audit, matches them to the tender and the status history, and resolves the load, PRO and bill of lading reference mismatches that stop the automatic match.", "Freight is paid late or in error, and routing violation re-bills go out to suppliers without the evidence to hold them.", ["Cross-references and master data", "Chargebacks and deductions management", "Reporting and documentation"]]]}, {"n": "Deductions, chargebacks and disputes", "owner": "Accounts receivable and deductions management", "outcome": "Resolve every deduction inside its dispute window: recover the invalid ones, clear the valid ones, and remove the causes.", "measures": ["Deduction rate", "Days deductions outstanding (DDO)", "Dispute win and recovery rate", "Days to deduction identification", "Unapplied cash rate"], "steps": [["Violation posted", "Portal", 0, "The retailer's systems record a defect against an order, shipment or invoice: short receipt, late or missing ship notice, label failure, pricing variance. It appears in the supplier portal.", "Violations are posted per order, shipment or carton with a reason code. Some programs allow a short review period to request an exemption before the charge issues; after that it stands unless disputed, and some types are not disputable.", "Pulls violation feeds or portal exports daily, matches each violation to the document trail (order, notice, acknowledgments, application advice), and routes it to the owner before the review period lapses.", "Violations become chargebacks unseen, and the review period that could have stopped them has already closed.", ["Monitoring", "Chargebacks and deductions management", "Partner follow-up"]], ["Debit memo", "812", 0, "The retailer issues a debit or credit adjustment naming the invoice or order, the amount and the reason: shortage, pricing, allowance, compliance. Some retailers send one each business day.", "Memos often use the retailer's own codes, not the standard adjustment list. One event can produce a memo, a portal entry and a remittance line. Resending the invoice to recover a short payment triggers a duplicate billing deduction.", "Maps each retailer's adjustment codes to the supplier's deduction categories, loads memos into the deductions system, and links them to the matching remittance lines so one event is not worked twice.", "Deductions are worked twice or not at all, and research starts from the bank statement instead of the memo.", ["Map build and maintenance", "Cross-references and master data", "Chargebacks and deductions management"]], ["Net remittance", "820 / REMADV", 0, "The payment arrives as one net amount. The remittance lists the invoices paid and each deduction with an adjustment reason code and a reference to the invoice, order or memo.", "Reason codes are standard or the retailer's own. The remittance may travel with the payment (CTX), separately, or as a short reference only (CCD). The dispute clock runs from the posting date, not from the remittance.", "Loads the remittance into cash application, auto-matches paid invoices, and opens a deduction case per adjustment line with retailer, reason, amount and references attached.", "Cash sits unapplied, nobody knows how many deductions are open, and the window runs down while someone reconciles the bank statement.", ["Chargebacks and deductions management", "Missing documents", "Monitoring"]], ["Research and classify", "ERP", 1, "The deductions team matches each case to order, ship notice, bill of lading, proof of delivery and invoice, and decides: valid, invalid, or a promotion to check against its authorization.", "The burden of proof sits with the supplier. Shortage claims need the signed bill of lading, proof of delivery and the notice listing the cartons; pricing claims need the order cost; promotional claims need the authorization and proof of performance.", "Keeps every document and acknowledgment per order retrievable for the dispute window and the post-audit period, and gives the deductions team one view linking order, notice, invoice, memo and remittance line.", "Evidence cannot be found in time, recoverable deductions are written off, and the same cause recurs because nobody traced it.", ["Reporting and documentation", "Chargebacks and deductions management", "Cross-references and master data"]], ["Dispute", "Portal", 1, "The supplier files one dispute per deduction in the retailer's portal with the evidence attached, and answers the retailer's requests for more information within days.", "Windows run from about a month to six months from the posting date, differ for domestic and import orders, and may allow no second dispute. Late ship notice fees and some drop ship refunds cannot be disputed at all.", "Tracks window expiry per retailer and deduction, assembles the evidence pack from the document archive, and records outcome and reason so repeat causes are visible by retailer, DC and document type.", "The window closes and a recoverable deduction becomes a permanent loss.", ["Chargebacks and deductions management", "Reporting and documentation", "Partner follow-up"]], ["Settle", "812, 820 / REMADV", 0, "The retailer approves or denies. Repayment comes as a credit adjustment or later remittance line; valid deductions are written off internally, with no credit sent.", "Repayment is netted into a later remittance under its own reason code, so cash application has to link it back to the original deduction. Post-audit claims can arrive long after the event under the same rules.", "Matches the repayment to the open case and closes it, and reports recovered, written off and open balances by retailer and reason, with root causes fed back to the order to cash owners.", "Recovered money lands as unexplained cash, cases stay open, and the deduction rate never moves.", ["Chargebacks and deductions management", "Reporting and documentation"]]]}, {"n": "Item and price synchronization", "owner": "Product data management, pricing and sales", "outcome": "Have correct item, hierarchy and cost data in the retailer's systems before the first order, and keep it correct.", "measures": ["Time to shelf (item setup cycle time)", "Issues per item", "Synchronized item rate", "Pricing deductions on invoices"], "steps": [["Load and publish", "GDSN CIP", 0, "The supplier loads each item hierarchy (consumer unit, case, pallet) into its source data pool with GTINs, dimensions, weights and classification, then publishes it to a target market or retailer.", "Every level of the hierarchy needs its own GTIN, provider GLN, target market and product classification. Measurements must describe production packaging, not pre-production samples; wrong case dimensions and unit counts are the common finding in retailer audits.", "Maps the item master export to the pool's load format, keeps GTIN to internal SKU cross-references current, checks that hierarchy links and mandatory attributes are complete before publishing, and tracks which retailers each hierarchy is published to.", "The item never reaches the retailer, the launch date slips, and the first order is written against an item the retailer cannot find.", ["Cross-references and master data", "Map build and maintenance", "Business programs"]], ["Register and validate", "GDSN RCI, CIS", 1, "The source data pool validates the item against GDSN rules, registers its keys (GTIN, provider GLN, target market) in the GS1 Global Registry, and matches them to the retailer's subscription.", "Schema errors are rejected with a GS1 Response. Global validation rule failures are rejected or passed with a review flag, and pools add national and retailer rules on top (pallet height, weight limits, local attributes) that the item must pass.", "Reads the GS1 Response for every publication, translates validation error codes into fixes for the product data team, and resubmits; confirms the retailer's subscription exists before chasing a notification that was never going to be sent.", "The item sits in the pool as rejected and nothing reaches the retailer, while the supplier believes it has been published.", ["Rejections", "Fix routing", "Cross-references and master data"]], ["Notify retailer", "GDSN CIN", 1, "Once the registry matches keys and subscription, the source pool sends the Catalogue Item Notification, carrying the full hierarchy, to the retailer's recipient pool for loading into the retailer's systems.", "The notification carries the whole hierarchy, so a change at one level republishes every level. Retailers often require attributes beyond the GDSN set and collect them through their own portals, so a synchronised item is not yet a set-up item.", "Monitors that each publication produced a notification at the recipient pool, reconciles the retailer's loaded item list against what was published, and investigates items the retailer says it never received before the retailer's setup deadline.", "The retailer's buyer waits for an item that is live in the supplier's pool, and the setup window for the launch closes.", ["Monitoring", "Missing documents", "Partner follow-up"]], ["Confirm item", "GDSN CIC", 2, "The retailer returns its decision: received (no decision yet), synchronised (loaded and kept in sync), review (data looks wrong, please fix) or rejected (stop sending updates).", "Confirmation is optional for the retailer, so silence is not acceptance. A review flag needs a corrected republication, and a rejected confirmation stops all further notifications for that hierarchy until the retailer requests the data again.", "Routes each confirmation state to an owner, treats review as a defect ticket with the retailer's comment attached, tracks time from publication to synchronised per retailer, and keeps the confirmation as proof the item was set up.", "Review requests go unanswered, the retailer rejects the hierarchy, and every later correction is silently dropped.", ["Rejections", "Fix routing", "Reporting and documentation"]], ["Cost and price", "832, 879 / PRICAT", 0, "The supplier sends cost, suggested retail, bracket or zone pricing and effective dates: a price and sales catalog for general retail, price information and promotion announcements in grocery.", "Every price needs a change type and effective date, and the retailer's cost file must match the order cost before orders are cut. Promotion announcements need dates, items, allowances and performance terms that match the agreed deal.", "Generates the price documents from the pricing system, validates bracket, zone and effective date segments against the retailer's guide, confirms acknowledgments, and checks that the next inbound orders carry the new cost.", "The retailer keeps ordering at the old cost, and the difference is deducted from every invoice until the cost file is fixed.", ["Document and version changes", "Cross-references and master data", "Chargebacks and deductions management"]], ["First order", "850 / ORDERS", 2, "The retailer orders the item by GTIN or its own item number at the cost in its file. The sync is proven when this order loads and the invoice matches.", "Orders for items not on file are blocked at the retailer, and in some drop ship programs no order is issued until the catalog is loaded. An invoice cost above the order cost is deducted, not negotiated.", "Watches the first orders for a new item for cross-reference failures and cost mismatches, holds them for review rather than letting them reject, and feeds the mismatch back to product data and pricing before the invoice is sent.", "The order rejects or ships at a cost the retailer will not pay, and the launch starts with a pricing deduction.", ["Monitoring", "Rejections", "Cross-references and master data"]]]}, {"n": "Direct store delivery", "owner": "Route sales, store receiving and accounts payable", "outcome": "Deliver to the store, agree quantity and cost at the back door, and get paid on that record.", "measures": ["Invoice discrepancy rate", "Adjustment rate at check-in", "Store in-stock rate", "Days to payment"], "steps": [["Authorize items", "888, 879 / PRICAT", 0, "Before the first drop, the supplier's items and costs are loaded and authorized in the retailer's DSD item file, through item maintenance and price information sets or the retailer's portal.", "Store systems block items that are not on file, discontinued or inactive, and pay the lower of the invoiced and the authorized cost. Cost changes and promotions must be in the file before the delivery that uses them.", "Keeps the supplier's item and cost master, the handheld's price book and the retailer's authorized list aligned, sends cost and item changes ahead of effective dates, and confirms acknowledgments before drivers deliver at the new cost.", "The store refuses lines at the door or pays the old cost, and the driver loses selling time arguing over items.", ["Cross-references and master data", "Document and version changes", "Partner onboarding"]], ["Delivery record", "894", 0, "At the back door the driver's handheld sends the delivery record over DEX to the store system: items, quantities, unit cost, allowances and any returns picked up.", "Supplier identifiers, store number and item codes must match the retailer's file exactly. One record per delivery; a resend with the same record number is rejected as a duplicate.", "Maintains the 894 map and the UCS version each retailer runs, keeps store and supplier identifiers current in the handheld and route system, and supports drivers whose DEX session fails so the delivery is not keyed by hand.", "The store keys the delivery from paper, errors enter both systems, and the payment is short or late.", ["Connections and protocols", "Support desk and on-call", "Map build and maintenance"]], ["Store check-in", "895", 1, "The receiver counts the delivery against the record. The store system returns an acknowledgment or line adjustments for shortages, overages, refused items and cost differences, which the driver accepts.", "Adjustments must point at the right line and carry a reason, and an adjustment must not apply twice when a record is resent. What the driver accepts at the door becomes the invoice of record.", "Maps adjustment and reason codes into the route accounting system so the supplier's receivable equals the store's accepted total, and reports adjustment patterns by store and item to sales and master data.", "The supplier bills the delivered quantity, the store pays the counted quantity, and the gap becomes a deduction nobody can trace.", ["Rejections", "Fix routing", "Reporting and documentation"]], ["Invoice of record", "894 or 810 / INVOIC", 0, "The handheld syncs to route accounting, which books the accepted record as the invoice. Retailers wanting an office record take a network 894 or an 810 per store delivery.", "The office record must equal what the store accepted, line for line, or it fails the match. Credits for returns and stales travel as separate credit records within a fixed window after pickup, and duplicates are rejected.", "Reconciles handheld records against what the retailer acknowledged, resends records the store never received, generates credit records for pickups inside the window, and monitors functional acknowledgments and application advices for rejected records.", "Deliveries that were made and accepted are never billed, or are billed twice and rejected, and the route's revenue does not reconcile.", ["Missing documents", "Monitoring", "Rejections"]], ["Match and pay", "820 / REMADV", 2, "Retailer accounts payable matches the supplier's records to the store-accepted deliveries, pays the lower of invoiced and authorized cost, audits a sample, and remits one net payment with adjustments listed.", "Payment runs off the accepted record, not the delivered quantity. Cost differences, unauthorized items and promotion allowances not on file are deducted with reason codes, and the summary of deliveries, returns and adjustments must tie to the payment.", "Loads the remittance into cash application, matches each paid record to the handheld delivery and its adjustments, and sends the DSD summary where the retailer requires one so both sides agree the period's totals.", "Thousands of small store invoices sit unapplied, and cost and quantity deductions age past the point where the route can explain them.", ["Chargebacks and deductions management", "Reporting and documentation", "Cross-references and master data"]]]}, {"n": "Vendor-managed inventory and CPFR", "owner": "Demand planning, replenishment and category management", "outcome": "Keep retailer stock at agreed levels, with the supplier building replenishment orders from shared sales and inventory data.", "measures": ["Replenishment in-stock rate", "Weeks of supply (inventory health)", "Forecast accuracy", "On-time and in-full (OTIF)"], "steps": [["Share activity", "852 / INVRPT, SLSRPT", 0, "Daily or weekly, the retailer sends product activity by item and location (sold, on hand, on order, committed, out of stock), sometimes with reserved purchase order numbers and expiry dates.", "Each quantity carries a qualifier that says what it is, and a mis-mapped qualifier turns on-order stock into on-hand stock. The feed must arrive on schedule; the supplier plans against whatever the last file said.", "Monitors the feed's arrival against its schedule and alerts on a missed or partial file, maps the retailer's quantity qualifiers and location codes to the planning system, and keeps the reserved order number pool loaded and unexpired.", "The supplier plans blind or on stale numbers, and the stores run out or overstock before anyone notices the feed stopped.", ["Monitoring", "Missing documents", "Map build and maintenance"]], ["Plan replenishment", "ERP", 1, "The supplier's planning system nets on hand and on order against agreed targets and forecast, and proposes order quantities in case and pallet multiples inside the agreed lead time.", "The agreement sets the targets: in-stock goal, weeks of supply, minimum and maximum levels, order multiples and who may override. Promotions and new items need forecast input the activity feed does not carry.", "Keeps retailer item numbers, GTINs and supplier SKUs cross-referenced and store and DC location tables current, so the planner's proposal maps back to the retailer's keys without manual repair.", "Stores get too much of slow items and too little of fast ones, and the retailer's in-stock score drops on the supplier's record.", ["Cross-references and master data", "Business programs"]], ["Place order", "855 / ORDRSP", 1, "The supplier sends the order it built as a purchase order acknowledgment quoting a reserved purchase order number, and the retailer's system loads it as its own purchase order.", "The retailer owns the number, the supplier owns the quantity. The number must be unused and unexpired, and items must be authorized for that location in the retailer's unit of measure.", "Maps the planner's output to the acknowledgment with the reserved number, validates it before sending, watches for the functional acknowledgment and any application advice, and confirms the order shows as on order in the next activity feed.", "The retailer has no purchase order to receive or pay against, and the shipment arrives as an unexpected delivery.", ["Map build and maintenance", "Business programs", "Rejections"]], ["Validate order", "824 / APERAK", 0, "The retailer's system checks the supplier's order: valid, unexpired number, authorized items, quantity rules. Rejections return as an application advice; accepted orders appear as on order in the next feed.", "A rejected order is not an order. The supplier must fix and resend under a valid number before the expiry, and nothing ships until the order is accepted; silence from the retailer means check the next feed, not ship.", "Routes each rejection reason to planning or master data, tracks rejected order rate by retailer, and reconciles yesterday's orders against today's on-order quantities to catch orders that were neither rejected nor loaded.", "Rejected orders go unseen, the replenishment cycle skips a beat, and the out-of-stock shows up on the supplier's scorecard.", ["Rejections", "Fix routing", "Partner follow-up"]], ["Ship and invoice", "856, 810 / DESADV, INVOIC", 1, "The supplier ships against the accepted order with a ship notice and invoices it, exactly as in order to cash, with the reserved purchase order number on every document.", "The retailer's normal compliance rules apply: ship notice before arrival, labels, delivery window, quantities equal to the accepted order. The supplier wrote the order, so a short or late shipment counts against it twice: fill rate and in-stock.", "Carries the reserved number from the acknowledgment through the ship notice and invoice without re-keying, and ties each shipment back to the activity feed so planning sees the stock as received, not still on order.", "The invoice fails to match the retailer's purchase order, and the next planning run still sees the goods as on order.", ["Monitoring", "Cross-references and master data", "Chargebacks and deductions management"]], ["Review scorecard", "Portal", 0, "The retailer publishes weekly supplier metrics: replenishment in-stock, inventory health, forecast accuracy and on-time in-full. In CPFR the two sides also review forecast exceptions against the joint plan.", "Often in-stock is measured against the daily forecast, not against whether any unit is on hand, so a store with one unit left can count as out. The agreement sets the goals, and the scorecard is what the buyer sees.", "Pulls the scorecard from the retailer's portal, reconciles the retailer's numbers to the supplier's own order, shipment and activity records, and supplies the evidence when a miss traces to a late feed or a rejected order rather than planning.", "The supplier cannot explain misses, and the buyer loses confidence in the program.", ["Reporting and documentation", "Business programs"]]]}, {"n": "Drop ship and marketplaces", "owner": "E-commerce operations and vendor management", "outcome": "Ship each consumer order from the vendor within the retailer's window, with tracking, and collect payment without refund chargebacks.", "measures": ["On-time ship rate", "Cancellation and backorder rate", "Valid tracking rate", "Inventory feed timeliness", "Order defect rate"], "steps": [["Inventory feed", "846 / INVRPT", 1, "The vendor sends available-to-sell quantity by item, at least daily and often several times a day, so the retailer only sells what the vendor can ship.", "Items must already be set up through the catalog before any order arrives. The feed is due at least daily and must load without errors; an item goes to zero in the feed before it is delisted.", "Schedules the feed from the warehouse system, validates item cross-references against the retailer's catalog, confirms each feed loaded, and alerts when a scheduled feed does not go out.", "The retailer sells stock the vendor does not have, cancels the consumer order, and scores the cancellation against the vendor.", ["Monitoring", "Cross-references and master data", "Missing documents"]], ["Consumer order", "850 / ORDERS", 0, "The retailer passes each consumer order as it is placed: one order per consumer, ship-to address, service level, expected ship date and the carrier to use.", "Orders flow all day and the expected ship date, usually the next day, starts the clock at order time. The functional acknowledgment is due within a day, and the retailer's carrier account or assigned carrier must be used.", "Collects orders many times a day into order management, resolves unknown items and address failures before they stall picking, and watches that every order received was acknowledged back.", "An order the vendor never loads is never shipped; the retailer refunds the consumer and charges the vendor.", ["Monitoring", "Missing documents", "Cross-references and master data"]], ["Acknowledge or cancel", "855 / ORDRSP", 1, "The vendor confirms each order line it will ship, or cancels lines it cannot fill, within hours of the order. Most programs allow few or no backorders.", "The acknowledgment window is measured in hours, a day at most, and some programs reject partial acknowledgments: accept or cancel the whole order. Vendor cancellations count toward a cancellation rate threshold that triggers chargebacks.", "Generates the acknowledgment from order management as soon as the order is allocated, maps line status codes to the program's list, and chases orders still unacknowledged before the window closes.", "The retailer cannot tell the consumer, the order is cancelled on the vendor's record, and the cancellation rate climbs.", ["Map build and maintenance", "Rejections", "Partner follow-up"]], ["Ship and track", "856 / DESADV", 1, "The vendor picks, packs to the retailer's packaging rules, ships on the retailer's carrier account, and sends the ship notice with a tracking number for every parcel.", "Ship within the retailer's window, usually a day, and send the notice with tracking once the parcel ships. Every parcel needs valid tracking, packaging follows the program's plain-box or branded-slip rule, and label SSCCs must match the notice where required.", "Builds the notice from warehouse ship confirmation and carrier tracking, validates tracking number format and carrier code before sending, and corrects rejected notices the same day.", "The consumer gets no tracking, the order is scored late or unshipped, and the retailer may refund it and charge the vendor.", ["Rejections", "Fix routing", "Monitoring"]], ["Invoice", "810 / INVOIC", 1, "The vendor invoices the retailer per consumer order, at the order cost, once the ship notice is accepted.", "Invoice within the program's window, usually a day after shipment, and only after the ship notice. One invoice per order, cost equal to the order cost, and no resend of an invoice already received.", "Triggers the invoice from the accepted ship notice rather than from order entry, validates order number and cost against the order, and routes application advice rejections to billing for correction.", "Invoices arrive before the notice or outside the window and are rejected, so a shipped order goes unpaid.", ["Rejections", "Cross-references and master data", "Monitoring"]], ["Payment and chargebacks", "820 / REMADV", 0, "The retailer pays on agreed terms net of any return allowance, late shipment fees and the value of consumer orders it refunded, each with a reason code.", "Where the program uses a return allowance, it is a fixed share of every invoice taken in place of item-level return credits. Consumer refund chargebacks are often not disputable; other disputes run through the portal within a fixed window.", "Loads the remittance into cash application, maps the program's reason codes, and matches each refund chargeback to the order, acknowledgment, ship notice and tracking record that show whether the vendor met the window.", "Chargebacks age unexamined, the allowance is booked as a shortage, and cash sits unapplied.", ["Chargebacks and deductions management", "Reporting and documentation", "Missing documents"]]]}, {"n": "3PL fulfillment", "owner": "Distribution and logistics operations", "outcome": "Ship retailer orders from a 3PL with ship notices, invoices and stock records that match what the warehouse did.", "measures": ["Order to shipping advice cycle time", "ASN timeliness and accuracy", "Inventory accuracy (ERP versus 3PL)", "Dock-to-stock time"], "steps": [["Stock the warehouse", "944 / RECADV", 1, "The 3PL receives stock the supplier announced on a transfer shipment advice and confirms quantities, with overs, shorts and damage.", "The 3PL contract sets receiving: an appointment, an advice before arrival, and the receipt advice within an agreed window after unloading. Items must exist in the 3PL's item master first, or receipts stall.", "Maps transfer orders to the advice, keeps the item cross-reference between ERP and 3PL item numbers current, posts the receipt advice to the ERP, and routes over, short and damage lines to inventory control.", "The ERP shows stock the warehouse cannot find, or goods sit on the receiving dock unavailable to allocate.", ["Cross-references and master data", "Monitoring", "Rejections"]], ["Retailer order", "850 / ORDERS", 2, "The retailer orders from the supplier as usual: items, quantities, ship window, ship-to and order type. Its compliance rules apply whichever warehouse ships.", "The ship window, routing rules and label guide bind the supplier, not the 3PL. Order type decides packing and label content, and the supplier must allocate the order to a warehouse that holds the stock before the pick cutoff.", "Monitors inbound orders into order management, resolves item cross-reference failures, confirms the functional acknowledgment, and checks that allocation picked the right warehouse for the ship-to and stock position.", "The order allocates to a warehouse without stock, or misses the pick cutoff, and the ship window is lost before anyone notices.", ["Monitoring", "Cross-references and master data", "Missing documents"]], ["Shipping order", "940 / INSDES", 0, "The supplier instructs the 3PL to pick, pack and ship: retailer order number, ship-to, ship window, carrier and routing, and the data the retailer's carton label needs.", "The 3PL contract sets an order cutoff for same-day shipment. The shipping order must carry every value the GS1-128 label and pack rules need, such as store, department and pack hierarchy, because the 3PL has no other source.", "Maps the retailer order and routing instructions into the shipping order, adds retailer-specific label data by program, watches for the 3PL's functional acknowledgment, and escalates orders not acknowledged before cutoff.", "The warehouse ships late, or ships with labels the retailer's dock cannot scan.", ["Map build and maintenance", "Business programs", "Monitoring"]], ["Shipping advice", "945 / DESADV", 1, "The 3PL confirms what shipped: ordered versus shipped quantity per line, carrier and SCAC, bill of lading or tracking numbers, lot numbers, and the SSCC on every carton or pallet.", "Many retailers want the ship notice at ship time, so the advice must arrive within minutes of the truck leaving; a nightly batch is too late. It must carry the order reference and every SSCC labeled.", "Validates each advice for the order reference, SSCC count and shipped quantities, posts shipments to the ERP, chases advices still missing after the carrier pickup, and reconciles short ships against the order.", "The supplier cannot build the retailer's ship notice in time and the ASN is late, or built from the shipping order and wrong.", ["Missing documents", "Partner follow-up", "Monitoring"]], ["Ship notice", "856 / DESADV", 0, "The supplier turns the shipping advice into the retailer's ship notice: shipment, order, pack and item hierarchy, the 3PL's SSCCs, carrier and bill of lading.", "The same timing and accuracy rules as a direct shipment apply, and the chargebacks land on the supplier. SSCCs must equal the labels the 3PL applied, item numbers must be the retailer's, and quantities must be the shipped ones.", "Runs the turnaround map from advice to notice, cross-references 3PL item numbers to the retailer's, checks pack hierarchy and SSCC counts before sending, and corrects application advice rejections before the goods arrive.", "A late or mismatched notice means hand receiving at the dock and a chargeback to the supplier, whoever caused it.", ["Map build and maintenance", "Rejections", "Chargebacks and deductions management"]], ["Inventory reconciliation", "846, 947 / INVRPT", 1, "The 3PL reports on-hand, allocated and damaged stock by item, usually daily, and sends adjustments with reason codes after cycle counts or a physical inventory.", "The contract sets the inventory accuracy threshold, the count cycle and who absorbs variances. Adjustments need a reason code and must post to the ERP, or the two stock positions drift apart.", "Loads the daily stock report, compares it with ERP on-hand by item and status, posts adjustments, and gives inventory control a variance list with the receipts, shipments and adjustments behind each difference.", "The ERP allocates stock the warehouse does not have, orders cancel or ship short, and fill rate falls.", ["Reporting and documentation", "Cross-references and master data", "Monitoring"]]]}, {"n": "Returns, credits and allowances", "owner": "Customer service, trade finance and accounts receivable", "outcome": "Take back or write off goods under an agreed authorization, and settle credits and allowances without unmatched deductions.", "measures": ["Return rate", "Return authorization cycle time", "Credit memo cycle time", "Days deductions outstanding (DDO)", "Dispute recovery rate"], "steps": [["Return request", "180 / RETANN", 0, "The retailer asks to return goods, by item and quantity, with a reason code (defective, damaged, overstock, recalled, wrong item) and the original order or invoice reference.", "Returns need prior authorization under the vendor agreement unless it allows return without authorization or substitutes a flat allowance. Reason codes decide disposition and who pays freight, and items must carry GTIN and the original order.", "Maps the request into the returns system, checks item and order references against the original sale, routes it to customer service with the agreement's rules for that reason code, and tracks the response window.", "Goods come back unannounced or the retailer deducts the value anyway, and the supplier has nothing to match it to.", ["Map build and maintenance", "Cross-references and master data", "Missing documents"]], ["Authorize and dispose", "180 / RETINS", 1, "The supplier approves or refuses, assigns the authorization number, and states the disposition: ship to a named return center, destroy in field, or keep with credit.", "The response is due within the agreement's window and the authorization carries a deadline. The authorization number must appear on the return shipment and on the retailer's debit, or the credit cannot be matched later.", "Generates the authorization with disposition and reason codes from the returns system, cross-references it to the retailer's request number, and tells the return center what to expect and when.", "The retailer ships to the wrong place or debits without an authorization, and the return cannot be matched to a credit.", ["Rejections", "Partner follow-up", "Reporting and documentation"]], ["Return and debit", "812", 0, "The retailer ships the goods under the authorization and takes the value at once as a debit memo, with its reason code, handling charge and the original invoice reference.", "The debit usually arrives before the goods and nets against the next remittance whether or not the supplier agrees. Handling fees and return freight follow the agreement, and the dispute window runs from the debit date.", "Loads the debit memo, maps the retailer's reason codes, matches it to the authorization number and original invoice, and opens a deductions case that waits for the receipt.", "The deduction sits unmatched in cash application and ages past the dispute window.", ["Chargebacks and deductions management", "Map build and maintenance", "Monitoring"]], ["Receive and grade", "WMS", 1, "The return center receives the goods against the authorization, counts them, and grades each unit: resalable, rework, destroy, or not the supplier's product.", "Receipt must be matched to the authorization and the debit, not just put away. Shortages against the debit, wrong or competitor product and expired authorizations are the grounds for disputing the debit, and they need receiving evidence.", "Feeds the receipt and grading from the warehouse system into the returns record, flags quantity and item differences against the debit, and attaches count sheets and photos to the deductions case.", "Credits go out for goods never returned, or valid disputes fail for lack of evidence.", ["Cross-references and master data", "Reporting and documentation", "Chargebacks and deductions management"]], ["Credit memo", "812 / INVOIC", 1, "The supplier credits the accepted quantities at the original invoice price less agreed handling, referencing the retailer's debit memo and authorization number.", "Agree per retailer whether it deducts on its debit or waits for the supplier's credit. Where it has deducted, the credit only closes that debit and must cite its number and amount, or the value is credited twice.", "Generates the credit from the graded receipt, maps it to the retailer's required form (adjustment or credit invoice), carries the debit and authorization numbers, and closes or disputes the deductions case with the difference.", "Both ledgers carry an open item that ages, and the retailer's debit stands as a deduction the supplier never recovers.", ["Chargebacks and deductions management", "Rejections", "Map build and maintenance"]], ["Allowances and settlement", "812, 820 / REMADV", 0, "The retailer bills back promotional allowances, markdown money and co-op after the event, claims shortages and price differences, and nets everything with debits and credits in the remittance.", "Every allowance must trace to a promotion authorization and proof of performance, and an allowance already taken off-invoice cannot be billed back again. Dispute windows run from the deduction date, and post audits arrive long after the period.", "Loads adjustments and remittance detail, maps the retailer's reason codes to deduction types, matches billbacks to the trade promotion record by reference and flags duplicates, and routes unsupported items to trade finance for dispute inside the window.", "Allowances are paid twice, accruals never clear, and deductions age past the window into write-offs.", ["Chargebacks and deductions management", "Reporting and documentation", "Business programs"]]]}, {"n": "Sales and inventory reporting", "owner": "Sales, category management and demand planning", "outcome": "Give suppliers store-level sales and inventory so they can plan supply, measure promotions and catch out-of-stocks early.", "measures": ["Feed timeliness and completeness", "Store-level in-stock", "Sell-through and weeks of supply", "Promotion lift"], "steps": [["Record sales", "Store systems", 0, "Store point-of-sale systems record unit sales by item and store, and the retailer's systems add on-hand, on-order and received quantities by location.", "The retailer decides the period (daily or weekly), the item identifier (retailer item number, GTIN or UPC) and which stores and distribution centers are included. Returns and markdowns may be netted or reported separately.", "Keeps the retailer's store list, item numbers and GTINs cross-referenced to the supplier's records, so sales land on the right product and location.", "Sales post against the wrong items or stores, and planning decisions rest on misattributed demand.", ["Cross-references and master data"]], ["Send activity", "852 / SLSRPT, INVRPT", 0, "On schedule, the retailer sends product activity by item and location: quantity sold, on hand, on order and received, each tagged with an activity code and the reporting period.", "Each quantity carries a qualifier, and the retailer's guide defines which ones it sends. National retailers send thousands of stores in one feed, so files are large and often split. Europe sends sales and stock as separate messages.", "Watches each feed against its schedule, alerts on a missing, late or partial file, and compares store and item counts with the prior period.", "The supplier works from last week's numbers without knowing it, and decisions lag the shelf.", ["Monitoring", "Missing documents", "Map build and maintenance"]], ["Acknowledge", "997 / CONTRL", 1, "The supplier's system returns a functional acknowledgment confirming the file was received and passed syntax checks.", "Some retailers require the acknowledgment within a set time and flag the supplier when it is missing. The acknowledgment confirms syntax only, not that the data loaded.", "Sends acknowledgments automatically and reconciles them against received files, so a rejected or unacknowledged feed is caught the same day.", "The retailer flags missing acknowledgments, and syntax-rejected files go unseen.", ["Rejections", "Monitoring"]], ["Load and validate", "Analytics", 1, "The supplier maps the feed into its demand planning or category analytics system, converts retailer item and store keys, and checks totals against prior periods.", "Qualifier mapping decides whether a quantity counts as sold, on hand or on order. A store missing from the feed reads as zero sales unless the load checks for it.", "Maintains qualifier and location mappings, flags stores or items missing from the period, and holds a load that falls outside expected volume.", "Silent gaps read as collapsing demand, or on-order stock reads as on hand, and the analytics mislead planners.", ["Map build and maintenance", "Cross-references and master data"]], ["Analyze sell-through", "Analytics", 1, "Planners and category managers review sell-through, weeks of supply, in-stock rate and promotion lift by store and item, and find stores trending to an out-of-stock.", "Retailer and supplier often define in-stock and weeks of supply differently. Promotion analysis needs the promotion calendar, which the feed does not carry.", "Delivers the activity data on time and in a consistent shape, so analysts spend their time on the numbers rather than repairing the feed.", "Out-of-stocks and slow movers surface weeks late, after the sales are lost.", ["Reporting and documentation"]], ["Act on findings", "ERP", 1, "The supplier adjusts production and shipment plans, raises out-of-stock risks with the buyer, and brings sell-through evidence to category reviews and promotion planning.", "In VMI programs the same data drives replenishment orders directly. Outside VMI, the supplier influences orders through the buyer.", "Links activity data to orders, shipments and deductions, so the supplier can show the buyer what sold, what shipped and what was charged back.", "The supplier negotiates without evidence and carries the cost of stock in the wrong place.", ["Business programs"]]]}, {"n": "Vendor onboarding and certification", "owner": "Vendor onboarding, EDI operations and vendor compliance", "outcome": "Get each new vendor exchanging the documents the retailer requires, tested and certified, before its first production order.", "measures": ["Time to go-live", "Test cycles per document", "Required documents certified", "Error rate in the first month live"], "steps": [["Publish requirements", "Portal", 0, "The retailer publishes its implementation guides, routing guide, label specifications and vendor compliance manual, with the document sets each vendor type must exchange.", "Requirements differ by vendor type: domestic, import, drop ship and DSD vendors run different document sets. Guides change on a release cycle, and vendors build to the version in force when they test.", "Hosts the retailer's guides and test rules, keeps each version on record, and tells vendors in testing when a guide they are building to changes.", "Vendors build maps to outdated or incomplete specifications, and the errors surface as rejections in production.", ["Document and version changes", "Business programs"]], ["Collect vendor profile", "Portal", 1, "The vendor completes the retailer's onboarding survey: company and vendor numbers, EDI contacts, interchange IDs and qualifiers, connection method, and the network or provider it uses.", "Interchange IDs and qualifiers must be unique and match what the vendor will send. Vendor numbers come from the retailer's merchandising system, so the survey waits on the buyer's vendor setup.", "Collects the survey, checks IDs and qualifiers against the existing community, and returns incomplete profiles to the vendor with the missing fields named.", "Test files arrive under IDs nobody recognizes, and the first production order goes to the wrong mailbox or not at all.", ["Partner onboarding", "Cross-references and master data"]], ["Test connection", "997 / CONTRL", 1, "The vendor's connection is set up and a test interchange runs in each direction to confirm addressing, envelopes, transport and functional acknowledgments.", "Each direction needs a returned functional acknowledgment before document testing starts. Certificates, endpoints and network routing must match the profile.", "Configures routing and the connection on the network, confirms acknowledgments flow both ways, and resolves addressing errors before document testing begins.", "Document testing stalls on transport errors, and vendors miss their go-live date for reasons unrelated to their documents.", ["Connections and protocols", "Fix routing"]], ["Exchange test documents", "850, 855, 856, 810 / ORDERS, ORDRSP, DESADV, INVOIC", 1, "The retailer sends test orders, and the vendor returns acknowledgments, ship notices with label data, and invoices built to the retailer's guides.", "Test scenarios cover each order type the vendor will receive. Ship notices are checked for pack hierarchy and SSCC data, and many retailers require sample labels to pass a scan test.", "Validates each test document against the retailer's rules as it arrives, explains failures in business terms, and lets vendors retest without opening a support ticket.", "Testing runs for weeks through email and tickets, and vendors certify on scenarios that do not match the orders they will receive.", ["Rejections", "Map build and maintenance"]], ["Review and certify", "997, 824 / CONTRL, APERAK", 0, "The retailer reviews test results by document and scenario, records each failure and correction, and certifies the vendor for production when every required document passes.", "Certification is per document set. A vendor certified for orders and invoices is not certified for ship notices, and testing is repeated when the vendor changes provider or rebuilds its maps.", "Tracks each vendor's progress through the test plan, with the tasks assigned and the errors encountered, so onboarding teams see who is stalled and why.", "Vendors go live with documents that were never certified, or wait for review while their first orders are already due.", ["Reporting and documentation", "Partner follow-up"]], ["Go live", "850 / ORDERS", 0, "The retailer switches the vendor to production and the first live orders flow. The first orders, ship notices and invoices are watched until they complete without errors.", "Some retailers reduce compliance chargebacks for a short period after go-live, then apply the full program. Go-live is coordinated with the buyer's first order.", "Monitors the vendor's first production documents against the rules used in testing, and flags missing acknowledgments, rejected ship notices and invoice errors early.", "Errors that testing did not catch become chargebacks under the full compliance program.", ["Monitoring", "Missing documents"]]]}] };
